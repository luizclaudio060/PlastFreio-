    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="top-bar">
        <div class="header-content">
            <a href="index.html" class="logo">🌿 PlastFreio</a>
            <nav class="nav-links">
                <a href="index.html">Início (IA)</a>
                <a href="problema.html">O Problema</a>

            </nav>
        </div>
    </header>

    <main class="container" style="margin-top: 40px;">
        <div class="article-content" style="max-width: 700px; margin: 0 auto;">
            <h2>Envie uma mensagem</h2>
            <p>Preencha o formulário abaixo e retornaremos o mais breve possível.</p>
            
            <form action="#" method="POST" style="margin-top: 30px;">
                <div class="form-group">
                    <label for="nome">Seu Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Seu E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                </div>
                
                <div class="form-group">
                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem" placeholder="Como podemos ajudar?" required></textarea>
                </div>
                
                <button type="submit" class="btn-ai" style="width: 100%; justify-content: center;">Enviar Mensagem</button>
            </form>
        </div>
    </main>

    <footer>
        <p><strong>PlastFreio</strong> - Iniciativa dedicada à prevenção da poluição por microplásticos.</p>
        <p>&copy; 2026 PlastFreio. Todos os direitos reservados.</p>
    </footer>
